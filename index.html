d text-gray-950"></span></p>
                    <p><strong>শখ:</strong> <span id="card-hobby" class="font-bold text-gray-950"></span></p>
                </div>

                <!-- নতুন ফানি স্কিল ও শর্ত সেকশন -->
                <div class="border-t border-amber-300 pt-2 text-[11px] space-y-1 bg-amber-50/80 p-2 rounded">
                    <p>🔥 <strong>ফ্রি ফায়ার/আড্ডা স্কিল:</strong> <span id="card-skill" class="font-semibold text-purple-900"></span></p>
                    <p>📜 <strong>বিশেষ শর্ত:</strong> <span id="card-condition" class="font-semibold text-red-800"></span></p>
                </div>
            </div>

            <button onclick="downloadID()" class="mt-4 w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition shadow">💾 ডাউনলোড আইডি কার্ড</button>
            <button onclick="location.reload()" class="mt-2 w-full bg-gray-500 text-white p-3 rounded-lg font-bold hover:bg-gray-600 transition shadow">আবার শুরু করো 🔄</button>
        </div>

        <!-- Step 8: সিকিউরড লগইন পেইজ -->
        <div id="step-8" class="step hidden-section">
            <h2 class="text-2xl font-bold mb-2 text-red-600">⚠️ সিকিউরড অ্যাডমিন লগইন</h2>
            <p class="text-xs text-gray-500 mb-4">কে কে ফাইজলামি করছে দেখতে লগইন করুন</p>
            <input type="text" id="username" placeholder="User Name" class="w-full p-3 border rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-red-400">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-red-400">
            <button onclick="checkLogin()" class="w-full bg-red-600 text-white p-3 rounded-lg font-bold hover:bg-red-700 transition mb-2">লগইন করুন</button>
            <button onclick="nextStep(1)" class="w-full bg-gray-300 text-gray-700 p-2 rounded-lg text-sm font-bold hover:bg-gray-400 transition">ফিরে যান</button>
        </div>

        <!-- Step 9: সাকসেসফুল ট্র্যাকিং লিস্ট -->
        <div id="step-9" class="step hidden-section">
            <h2 class="text-2xl font-bold mb-4 text-green-600">😎 অভিনন্দন! আপনি আসল বস্!</h2>
            <p class="text-sm text-gray-600 mb-2">আইডি কার্ড তৈরি করা শিকারদের সম্পূর্ণ তালিকা:</p>
            <div id="victim-list" class="bg-gray-100 p-3 rounded-lg text-left text-xs max-h-60 overflow-y-auto border mb-4 space-y-2"></div>
            <button onclick="clearHistory()" class="w-full bg-red-500 text-white p-2.5 rounded-lg font-bold hover:bg-red-600 transition mb-2 text-xs">সব হিস্টরি ডিলিট করুন 🗑️</button>
            <button onclick="location.reload()" class="w-full bg-blue-500 text-white p-3 rounded-lg font-bold hover:bg-blue-600 transition">হোমে ফিরে যান 🔄</button>
        </div>

    </div>

    <script>
        // সিলেটি টাইম জোন অনুযায়ী লাইভ ক্লক আপডেট
        function updateClock() {
            const options = { timeZone: 'Asia/Dhaka', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const timeString = new Date().toLocaleTimeString('en-US', options);
            document.getElementById('live-clock').innerText = `সিলেট টাইম: ${timeString}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        let victims = JSON.parse(localStorage.getItem('victims_list')) || [];

        // ফিল্ড ভ্যালিডেশন
        function validateStep(stepNum) {
            if (stepNum === 1) {
                let name = document.getElementById('name').value.trim();
                let err = document.getElementById('error-1');
                if (name === "" || name.length < 2 || /^[.,\/#!$%\^&\*;:{}=\-_`~()0-9]+$/.test(name)) {
                    err.classList.remove('hidden');
                    return;
                }
                err.classList.add('hidden');
                sessionStorage.setItem('tmp_name', name);
                nextStep(2);
            } 
            else if (stepNum === 2) {
                let age = document.getElementById('age').value;
                let err = document.getElementById('error-2');
                if (age === "" || age <= 0 || age > 120) {
                    err.classList.remove('hidden');
                    return;
                }
                err.classList.add('hidden');
                sessionStorage.setItem('tmp_age', age);
                nextStep(3);
            } 
            else if (stepNum === 3) {
                let address = document.getElementById('address').value.trim();
                let err = document.getElementById('error-3');
                if (address === "" || address.length < 2) {
                    err.classList.remove('hidden');
                    return;
                }
                err.classList.add('hidden');
                sessionStorage.setItem('tmp_address', address);
                nextStep(4);
            }
            else if (stepNum === 5) {
                let hobby = document.getElementById('hobby').value.trim();
                let err = document.getElementById('error-5');
                if (hobby === "") {
                    err.classList.add('hidden'); // Fix typo check
                    err.classList.remove('hidden');
                    return;
                }
                err.classList.add('hidden');
                sessionStorage.setItem('tmp_hobby', hobby);
                sessionStorage.setItem('tmp_rel', document.getElementById('relationship').value);

                nextStep(6);
            }
        }

        function nextStep(stepNumber) {
            document.querySelectorAll('.step').forEach(el => el.classList.add('hidden-section'));
            document.getElementById('step-' + stepNumber).classList.remove('hidden-section');
        }

        function moveButton(btnId) {
            const btn = document.getElementById(btnId);
            const randomX = Math.floor(Math.random() * 200) - 100;
            const randomY = Math.floor(Math.random() * 100) - 50;
            btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // ফানি র্যান্ডম জেনারেটর এরে
        const funnySkills = ["১০০% ফাইজলামি ও আড্ডা মাস্টার ☕", "প্রো গেমার (মরে গিয়ে টিমমেট গালি দেয়) 🎮", "পকেটে টাকা নাই কিন্তু ভাব মারাত্মক 😎", "মাঝে মাঝে সিরিয়াস, বাকি সময় পাগল 🤪", "সাতকরা দিয়ে বিরিয়ানি খাদক 🍛"];
        const funnyConditions = ["প্রতিদিন ফুচকা খাওয়াতে হবে এবং শাশুড়ির সাথে তর্কে হারতে হবে।", "প্রেমিকাকে ফেসবুকের পাসওয়ার্ড লিখে দিতে হবে বাধ্যতামূলক।", "রাইতে ঘুম থেকে ডেকে চা বানিয়ে খাওয়াতে হবে।", "কোনো শর্ত নাই, শুধু হাসিমুখে বাঁচার অধিকার আছে!"];

        // ফাইনাল বাটনে ক্লিক করার সাথে সাথে সম্পূর্ণ ডাটা লোকালস্টোরেজে সেভ হবে
        function saveAndGenerateCard() {
            let randomSkill = funnySkills[Math.floor(Math.random() * funnySkills.length)];
            let randomCondition = funnyConditions[Math.floor(Math.random() * funnyConditions.length)];

            let currentVictim = {
                name: sessionStorage.getItem('tmp_name'),
                age: sessionStorage.getItem('tmp_age'),
                address: sessionStorage.getItem('tmp_address'),
                relationship: sessionStorage.getItem('tmp_rel'),
                hobby: sessionStorage.getItem('tmp_hobby'),
                skill: randomSkill,
                condition: randomCondition,
                time: new Date().toLocaleString('en-US', { timeZone: 'Asia/Dhaka' })
            };

            victims.push(currentVictim);
            localStorage.setItem('victims_list', JSON.stringify(victims));

            document.getElementById('card-name').innerText = currentVictim.name;
            document.getElementById('card-age').innerText = currentVictim.age;
            document.getElementById('card-address').innerText = currentVictim.address;
            document.getElementById('card-rel').innerText = currentVictim.relationship;
            document.getElementById('card-hobby').innerText = currentVictim.hobby;
            document.getElementById('card-skill').innerText = currentVictim.skill;
            document.getElementById('card-condition').innerText = currentVictim.condition;
            
            nextStep(7);
        }

        function downloadID() {
            const card = document.getElementById('capture-area');
            html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Sylheti_Funny_ID_Card.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        let failedAttempts = 0;
        function checkLogin() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;

            // ইউজারনেম: Admin69 এবং পাসওয়ার্ড: 6969
            if(user === 'Admin69' && pass === '6969') {
                let listDiv = document.getElementById('victim-list');
                victims = JSON.parse(localStorage.getItem('victims_list')) || [];
                
                if(victims.length === 0) {
                    listDiv.innerHTML = '<p class="text-center text-gray-500">এখনো কেউ আইডি কার্ড বানায় নাই!</p>';
                } else {
                    listDiv.innerHTML = victims.map((v, i) => `
                        <div class="bg-white p-2 rounded shadow-sm border border-gray-200">
                            <p class="font-bold text-purple-700">🎯 শিকার #${i+1}</p>
                            <p><strong>নাম:</strong> ${v.name}</p>
                            <p><strong>বয়স:</strong> ${v.age} বছর</p>
                            <p><strong>বাসা:</strong> ${v.address}</p>
                            <p><strong>স্ট্যাটাস:</strong> ${v.relationship}</p>
                            <p><strong>শখ:</strong> ${v.hobby}</p>
                            <p><strong>স্কিল:</strong> ${v.skill}</p>
                            <p><strong>শর্ত:</strong> ${v.condition}</p>
                            <p class="text-gray-400 text-[10px] mt-1">সময়: ${v.time}</p>
                        </div>
                    `).join('');
                }
                nextStep(9);
            } else {
                failedAttempts++;
                if(failedAttempts >= 3) {
                    alert('🚨 অনেকবার ভুল পাসওয়ার্ড দিয়েছেন! আপনাকে সাইট থেকে বের করে দেওয়া হলো!');
                    window.location.href = "https://www.google.com";
                } else {
                    alert(`❌ ভুল পাসওয়ার্ড! আর মাত্র ${3 - failedAttempts} বার সুযোগ আছে।`);
                }
            }
        }

        // হিস্টরি ক্লিয়ার করার ফাংশন
        function clearHistory() {
            if(confirm('সব হিস্টরি মুছে ফেলতে চান?')) {
                localStorage.removeItem('victims_list');
                victims = [];
                document.getElementById('victim-list').innerHTML = '<p class="text-center text-gray-500">হিস্টরি খালি করা হয়েছে!</p>';
            }
        }
    </script>
</body>
  </html>
